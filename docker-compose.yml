# Fixed project name, so the data volume is the same whatever the folder is
# called (a ZIP download unpacks to scView-main, a git clone to scView).
name: scview

# Each service pulls a prebuilt image from GHCR (published per release by
# .github/workflows/publish-images.yml) and falls back to building from source
# when that image isn't available. `docker compose up -d --build` always builds
# from source. Set SCVIEW_VERSION in .env to use another tag, e.g. `main`.
# A release must bump all three tags; the publish workflow checks this.

services:
  backend:
    image: ghcr.io/thirtysix/scview-backend:${SCVIEW_VERSION:-0.38.0}
    # Back up by itself if it is killed, e.g. out of memory on a small machine.
    restart: on-failure
    # SCVIEW_MEMORY_GB (.env, suggested by the start scripts) caps its memory, so a
    # dataset too big for the machine stops scView rather than the computer.
    # Unset: no limit. No swap beyond it, which would freeze the machine instead.
    mem_limit: ${SCVIEW_MEMORY_GB:-0}g
    memswap_limit: ${SCVIEW_MEMORY_GB:-0}g
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - dataset_data:/data
      - msigdb:/msigdb
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data
      - CONVERTER_URL=http://converter:8001
      - MSIGDB_DIR=/msigdb
    depends_on:
      converter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # A slow machine can need well over 30 s to import the analysis stack.
      start_period: 120s

  frontend:
    image: ghcr.io/thirtysix/scview-frontend:${SCVIEW_VERSION:-0.38.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

  converter:
    image: ghcr.io/thirtysix/scview-converter:${SCVIEW_VERSION:-0.38.0}
    restart: on-failure
    mem_limit: ${SCVIEW_MEMORY_GB:-0}g
    memswap_limit: ${SCVIEW_MEMORY_GB:-0}g
    build:
      context: ./converter
      dockerfile: Dockerfile
    volumes:
      - dataset_data:/data
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  dataset_data:
  msigdb:
