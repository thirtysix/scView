[project]
name = "scview"
version = "0.40.0"
description = "Single-cell RNA-seq browser-based visualization tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 0.13 refuses "/" in h5 keys, which marker tables for labels like
    # "Tcm/Naive helper T cells" still write (as pts columns).
    "anndata>=0.11.0,<0.13",
    "scanpy>=1.10.0",
    "scipy>=1.14.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "gseapy>=1.1.0",
    "harmonypy>=0.0.10",
    "scikit-misc>=0.5.3",  # loess for the seurat_v3 HVG flavour; 0.5.3 is the first with linux aarch64 wheels
    "scikit-image>=0.22.0",  # Scrublet auto-threshold (sc.pp.scrublet doublet detection)
    "openai>=1.50.0",
    "openpyxl>=3.1.0",
    "loompy>=3.0.7",
    "zarr>=2.18.0",
    "dask>=2026.8.0",  # chunked QC..PCA for large datasets (core/chunked.py); pure Python, tested with anndata 0.12.19
    "asyncpg>=0.30.0",  # Neon/Postgres + pgvector for the RAG co-pilot corpora
    "beautifulsoup4>=4.12.0",  # tutorial-corpus HTML extraction (RAG ingestion)
    "celltypist>=1.6.0",  # reference-based cell-type annotation (small CPU models)
    "pydeseq2>=0.5.0",  # pseudobulk DE across donors (DESeq2 in Python; formula designs)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scview"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# The rule set the code is written to. Ruff 0.17 enabled many more rules by
# default, which would fail every fresh install without a code change.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
