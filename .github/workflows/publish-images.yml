# Builds the backend, frontend and converter images for amd64 and arm64 on
# native runners and publishes them to GHCR, so `docker compose up` can pull
# them instead of building from source.
#
# A release tag (vX.Y.Z) publishes X.Y.Z, X.Y and latest. A manual run
# (Actions -> Publish images -> Run workflow) publishes the branch name and
# sha-<short> tags, for testing without a release.
name: Publish images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/scview

jobs:
  check-version:
    # docker-compose.yml pins each image to a version. A release whose tag
    # doesn't match would publish images that no compose file pulls.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose file pins this release
        run: |
          want="${GITHUB_REF_NAME#v}"
          for svc in backend frontend converter; do
            grep -qF "scview-${svc}:\${SCVIEW_VERSION:-${want}}" docker-compose.yml || {
              echo "::error::docker-compose.yml does not pin scview-${svc} to ${want}"
              exit 1
            }
          done

  build:
    needs: check-version
    # check-version is skipped on manual runs; build anyway unless it failed.
    if: ${{ !cancelled() && needs.check-version.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, converter]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    # Runs even if one architecture failed, so the other is still published;
    # the failed build job keeps the run red.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, converter]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
      - name: Create the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
        run: |
          if [ -z "$(ls -A)" ]; then
            echo "::error::no architecture of ${IMAGE} built"
            exit 1
          fi
          mapfile -t tags < <(jq -r '.tags[]' <<< "$META_JSON")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          for d in *; do args+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${tags[0]}"
