<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scView - Single-Cell RNA-Seq Viewer</title>
    <!-- plotly.js source partials (our slim bundle) reference Node's `global`;
         define it before any module loads so they run in the browser. -->
    <script>
      window.global = window.global || window;
    </script>
    <!-- Dark theme before first paint (no white flash); lib/theme.ts takes over. -->
    <script>
      try {
        var p = localStorage.getItem("scview.theme.v1");
        if (p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
